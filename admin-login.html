<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - CampaignPro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: Arial, sans-serif; 
            background: #0f172a; 
            color: #f8fafc; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            padding: 20px;
        }
        .login-card {
            background: #1e293b; padding: 40px 30px; border-radius: 16px;
            width: 100%; max-width: 400px; box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            border: 1px solid #334155;
        }
        .login-card h2 { text-align: center; margin-bottom: 8px; color: #10b981; font-size: 24px; font-weight: 800; }
        .subtitle { text-align: center; color: #94a3b8; font-size: 13px; margin-bottom: 25px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 7px; font-size: 13px; font-weight: bold; color: #cbd5e1; }
        .form-group input {
            width: 100%; padding: 14px; border: 1px solid #475569; border-radius: 9px;
            background: #0f172a; color: #f8fafc; outline: none; transition: .2s;
        }
        .form-group input:focus { border-color: #10b981; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15); }
        .btn {
            width: 100%; padding: 14px; background: #059669; color: white; border: none;
            border-radius: 9px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px;
            transition: .2s;
        }
        .btn:hover { background: #047857; }
        .btn:disabled { opacity: 0.65; cursor: not-allowed; }
        .error {
            background: #7f1d1d; color: #fca5a5; padding: 11px; border-radius: 8px;
            font-size: 13px; text-align: center; margin-top: 15px; display: none; border: 1px solid #991b1b;
        }
        .success {
            background: #14532d; color: #86efac; padding: 11px; border-radius: 8px;
            font-size: 13px; text-align: center; margin-top: 15px; display: none; border: 1px solid #166534;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Admin Portal</h2>
        <p class="subtitle">CampaignPro Control Panel</p>
        
        <form id="adminLoginForm">
            <div class="form-group">
                <label>Admin Email</label>
                <input type="email" id="email" required placeholder="admin@example.com" autocomplete="email">
            </div>
            <div class="form-group">
                <label>Security Password</label>
                <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
            </div>
            <button type="submit" class="btn" id="loginBtn">Secure Login</button>
            <div id="errorMsg" class="error"></div>
            <div id="successMsg" class="success">Login successful! Redirecting to panel...</div>
        </form>
    </div>

    <script type="module">
        import { auth, db } from './firebase.js';
        import { signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const form = document.getElementById('adminLoginForm');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const loginBtn = document.getElementById('loginBtn');

        // Optional backup check list
        const ADMIN_EMAILS = ["sakilmollaxyz@gmail.com"];

        // Check if admin is already signed in
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    if (userDoc.exists() && (userDoc.data().role === 'admin' || ADMIN_EMAILS.includes(user.email.toLowerCase()))) {
                        window.location.href = "admin.html";
                    }
                } catch (e) {
                    console.error("Auth verify error:", e);
                }
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            loginBtn.disabled = true;
            loginBtn.textContent = "Verifying Credentials...";
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                // 1. Firebase Authentication
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 2. Role Check via Firestore
                const userDoc = await getDoc(doc(db, "users", user.uid));
                const isAdmin = (userDoc.exists() && userDoc.data().role === 'admin') || ADMIN_EMAILS.includes(user.email.toLowerCase());

                if (!isAdmin) {
                    await signOut(auth);
                    throw new Error("ACCESS_DENIED");
                }

                successMsg.style.display = 'block';
                setTimeout(() => {
                    window.location.href = "admin.html";
                }, 1000);

            } catch (error) {
                console.error("Login Error:", error);
                if (error.message === "ACCESS_DENIED") {
                    errorMsg.textContent = "Access Denied: You do not have administrator permissions.";
                } else if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    errorMsg.textContent = "Invalid email or password.";
                } else {
                    errorMsg.textContent = "Authentication failed: " + (error.message || "Please try again.");
                }
                errorMsg.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.textContent = "Secure Login";
            }
        });
    </script>
</body>
</html>
